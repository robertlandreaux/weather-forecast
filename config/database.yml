# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  variables:
    statement_timeout: <%= ENV.fetch("STATEMENT_TIMEOUT") { nil } %>
    idle_in_transaction_session_timeout: <%= ENV.fetch("IDLE_IN_TRANSACTION_SESSION_TIMEOUT") { nil } %>

development:
  <<: *default
  database: weather_forecast_development
  port: <%= ENV.fetch("POSTGRES_PORT") { 5432 } %>
  database: <%= ENV.fetch("POSTGRES_DB") { "weather_forecast_development" } %>
  username: <%= ENV.fetch("POSTGRES_USER") { "weather_forecast" } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { nil } %>
  host: <%= ENV.fetch("POSTGRES_HOST") { "localhost" } %>

test:
  <<: *default
  database: weather_forecast_test

production:
  primary: &default
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
